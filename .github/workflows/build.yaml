# Build pull requests; publish images only from main.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        step: [crop, composite]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          IMAGE_ID=ghcr.io/eoap/ogc-bp-ap-annex-a-examples/${{ matrix.step }}
          docker build containers --file containers/Dockerfile.${{ matrix.step }} --tag "$IMAGE_ID:latest"
      - name: Check container tools
        run: |
          IMAGE_ID=ghcr.io/eoap/ogc-bp-ap-annex-a-examples/${{ matrix.step }}
          docker run --rm "$IMAGE_ID:latest" bash -ec 'gdal_translate --version; gdalbuildvrt --version; jq --version; bash -n /usr/bin/${{ matrix.step }} /functions.sh'
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=ghcr.io/eoap/ogc-bp-ap-annex-a-examples/${{ matrix.step }}
          docker push "$IMAGE_ID:latest"
